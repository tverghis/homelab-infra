global:
  scrape_interval: 5m
  evaluation_interval: 1m

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets:
          - "prometheus:9090"

  - job_name: "machines"
    static_configs:
      - targets:
          - "host.docker.internal:9100"
        labels:
          host: "ocelot"
