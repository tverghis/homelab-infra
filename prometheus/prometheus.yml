global:
  evaluation_interval: 1m

scrape_configs:
  - job_name: "prometheus"
    scrape_interval: 10m
    static_configs:
      - targets:
          - "prometheus:9090"

  - job_name: "coredns"
    scrape_interval: 15s
    static_configs:
      - targets:
          - "coredns:9153"
        labels:
          host: "ocelot"

  - job_name: "copyparty"
    scrape_interval: 30s
    metrics_path: "/.cpr/metrics"
    basic_auth:
      username: "prometheus"
      password_file: "/run/secrets/copyparty_metrics_password"
    static_configs:
      - targets:
          - "copyparty:3923"
        labels:
          host: "ocelot"

  - job_name: "machines"
    scrape_interval: 1m
    static_configs:
      - targets:
          - "host.docker.internal:9100"
        labels:
          host: "ocelot"
      - targets:
          - "kokod:9100"
        labels:
          host: "kokod"
